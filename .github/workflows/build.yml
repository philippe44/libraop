name: Build libraop for all supported platforms

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  linux:
    runs-on: ubuntu-latest
    container:
      image: debian:bookworm
    strategy:
      matrix:
        include:
          - os-arch: aarch64
            gcc-arch: aarch64-linux-gnu
          - os-arch: x86_64
            gcc-arch: x86_64-linux-gnu
    steps:
      - name: Install Git
        run: |
          apt-get update
          apt-get install -y git

      - name: Checkout
        uses: actions/checkout@v3
        with:
          submodules: recursive

      - name: Prepare build environment
        run: |
          apt-get install -y build-essential make gcc g++ libssl-dev ${{ matrix.os-arch == 'aarch64' && 'gcc-aarch64-linux-gnu g++-aarch64-linux-gnu' || '' }}
          mkdir -p release

      - name: Build
        run: |
          if [ "${{ matrix.os-arch }}" = "aarch64" ]; then
            export CC=aarch64-linux-gnu-gcc
            export CXX=aarch64-linux-gnu-g++
            # Ensure standard libraries are statically linked
            export LDFLAGS="-static-libgcc -static-libstdc++"
          else
            export CC=x86_64-linux-gnu-gcc
            export CXX=x86_64-linux-gnu-g++
            # Use baseline x86-64 with generic tuning for maximum compatibility
            # -static-libgcc -static-libstdc++ ensure stdlib is statically linked
            export CFLAGS="-march=x86-64 -mtune=generic"
            export CXXFLAGS="-march=x86-64 -mtune=generic"
            export LDFLAGS="-static-libgcc -static-libstdc++"
          fi
          make HOST=linux PLATFORM=${{ matrix.os-arch }} STATIC=1 -j$(nproc)
          chmod +x bin/cliraop-linux-${{ matrix.os-arch }}
          cp bin/cliraop-linux-${{ matrix.os-arch }} release/

      - name: Verify binary
        run: |
          echo "Binary info:"
          file bin/cliraop-linux-${{ matrix.os-arch }} || true
          echo ""
          echo "Dynamic dependencies (x86_64 only):"
          if [ "${{ matrix.os-arch }}" = "x86_64" ]; then
            ldd bin/cliraop-linux-${{ matrix.os-arch }} 2>&1 || echo "Could not run ldd (static binary or not executable on this platform)"
          else
            echo "Skipping ldd for cross-compiled ${{ matrix.os-arch }} binary"
          fi
          echo ""
          echo "Binary size:"
          ls -lh bin/cliraop-linux-${{ matrix.os-arch }}
          echo ""
          echo "Checking for common dynamic libraries in binary:"
          strings bin/cliraop-linux-${{ matrix.os-arch }} | grep -E '\.so\.' | head -20 || echo "No .so references found (likely fully static)"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cliraop-linux-${{ matrix.os-arch }}
          path: release/
